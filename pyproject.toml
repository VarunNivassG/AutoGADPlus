[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autogad-reproduction"
version = "0.1.0"
description = "Phase-1 reproduction framework for AutoGAD and ANEMONE"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "networkx>=3.1",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "torch>=2.1",
  "matplotlib>=3.7",
  "pandas>=2.0",
]

[project.scripts]
autogad = "autogad_reproduction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
